name: PR language

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  pull-requests: read

jobs:
  pr-language:
    runs-on: ubuntu-latest
    steps:
      - name: 检查 PR 中文标题与正文
        uses: actions/github-script@v7
        with:
          script: |
            // Dependabot 生成的依赖更新记录可保留英文。
            if (context.payload.pull_request?.user?.login === 'dependabot[bot]') {
              core.info('Dependabot PR: skip Chinese prose validation.');
              return;
            }
            const title = context.payload.pull_request?.title ?? '';
            const body = context.payload.pull_request?.body ?? '';
            const countHan = (value) => (value.match(/\p{Script=Han}/gu) ?? []).length;
            const prose = body
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/(?:^|\n)\s*```[\s\S]*?```/g, '')
              .replace(/(?:^|\n)\s*~~~[\s\S]*?~~~/g, '')
              .replace(/`[^`\n]*`/g, '')
              .replace(/^\s{0,3}#{1,6}.*$/gm, '')
              .replace(/https?:\/\/[^\s)]+/g, '');
            const errors = [];
            if (countHan(title) < 2) errors.push('PR 标题至少包含两个汉字。');
            if (countHan(prose) < 2) errors.push('PR 正文需要包含中文叙述，不能只有标题、代码或链接。');
            if (errors.length) core.setFailed(errors.join('\n'));
            else core.info('PR 中文检查通过。');
