<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语法图谱实验 · 文法？知るか！</title>
<style>
:root{--bg:#f7f6f2;--paper:#fffefa;--ink:#293335;--muted:#7b8685;--line:#e2e5de;--red:#aa381e;--rose:#fff0e9;color-scheme:light;font-family:"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
main{max-width:1360px;margin:auto;padding:29px 34px 38px}
header{display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{font-size:17px;font-weight:700}
.version{font-size:11px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:25px;padding:6px 11px}
.intro{margin:74px 0 30px;display:flex;justify-content:space-between;align-items:flex-end;gap:22px;flex-wrap:wrap}
.eyebrow{font-size:11px;color:var(--red);letter-spacing:.15em;font-weight:700}
h1{font-size:clamp(26px,3.4vw,43px);font-weight:640;letter-spacing:-.03em;margin:10px 0}
.intro p{font-size:13px;line-height:1.8;color:var(--muted);margin:0}
.switch{display:flex;gap:4px;border:1px solid var(--line);background:#eeefeb;border-radius:11px;padding:4px}
.switch button{border:0;background:none;color:var(--muted);font-size:14px;padding:10px 21px;border-radius:8px}
.switch button[aria-pressed=true]{background:var(--paper);color:var(--ink);box-shadow:0 1px 7px #28383315;font-weight:650}
.shell{border:1px solid var(--line);border-radius:18px;background:var(--paper);overflow:hidden}
.tools{min-height:76px;display:flex;align-items:center;justify-content:space-between;padding:16px 23px;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.surface{display:flex;align-items:baseline;gap:14px}
.surface small{font-size:11px;color:var(--muted)}
output{font-size:clamp(20px,2.3vw,29px);font-family:"Yu Gothic","Noto Sans JP",sans-serif;font-weight:650;overflow-wrap:anywhere}
.actions{display:flex;gap:9px}
.actions button{border:1px solid var(--line);padding:8px 12px;color:var(--muted);font-size:12px;border-radius:8px;background:none}
.actions button:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.actions button:disabled{opacity:.4;cursor:default}
.stage{position:relative;overflow:auto;min-height:540px;background-image:radial-gradient(#d1d7d0 .8px,transparent .9px);background-size:20px 20px}
#graph{display:block;height:540px}
.edge{stroke:#b8c0bb;stroke-width:1.7;fill:none;stroke-dasharray:5 6}
.edge.solid{stroke:var(--red);stroke-width:2.2;stroke-dasharray:none}
.node{cursor:grab;touch-action:none}
.node.dragging{cursor:grabbing}
.node .shape{fill:#fffefa;stroke:#bcc4bd;stroke-width:1.4;rx:13}
.node.ghost .shape{fill:#f8f9f5;stroke:#bac4c0;stroke-dasharray:5 5}
.node.active .shape{fill:#fff4ef;stroke:#c59b8b;stroke-width:1.8}
.node.root .shape{fill:var(--red);stroke:var(--red)}
.node:hover .shape{stroke:var(--red);stroke-width:2}
.node text{pointer-events:none;fill:var(--ink)}
.node.root text{fill:white}
.node.ghost text{opacity:.65}
.node .mainlabel{font:650 22px "Yu Gothic","Noto Sans JP",sans-serif}
.node .sublabel{font:11px "Segoe UI","Microsoft YaHei",sans-serif;fill:var(--muted)}
.node.root .sublabel{fill:#ffffffb5}
.node .segment-bg{fill:#fff;stroke:#dfc9bf;stroke-width:1;rx:7}
.node.root .segment-bg{fill:#ffffff16;stroke:#ffffff88}
.node .segment-divider{stroke:#dfc9bf;stroke-width:1}
.node.root .segment-divider{stroke:#ffffff88}
.node .information{stroke:#bdc9c3;fill:#fffefa}
.node.root .information{stroke:#ffffff80;fill:#ffffff20}
.node .infoletter{font:700 10px "Segoe UI",sans-serif;fill:#7e8984}
.node.root .infoletter{fill:white}
.trace{border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:49px;padding:11px 22px}
.trace .hint{font-size:11px;color:var(--muted);margin-right:8px}
.trace button{border:0;border-radius:7px;background:#f1efec;color:#71645e;padding:5px 9px;font-size:12px}
.trace button:hover{background:var(--rose);color:var(--red)}
.trace .arrow{font-size:12px;color:#a5ada8}
.popover{position:absolute;z-index:5;right:20px;bottom:20px;width:min(320px,calc(100% - 40px));background:var(--paper);border:1px solid #e0beb2;border-radius:13px;padding:18px 20px;box-shadow:0 12px 36px #33333317}
.popover[hidden]{display:none}
.popover h2{font-size:17px;margin:0 24px 10px 0}
.popover p{font-size:12px;color:#65716f;line-height:1.8;margin:0}
.popover button{border:0;background:none;color:var(--muted);position:absolute;right:10px;top:9px;padding:6px}
.foot{font-size:12px;line-height:1.8;color:var(--muted);margin:17px 3px}
@media(max-width:680px){main{padding:21px 14px}.intro{margin:43px 0 23px}.tools{padding:13px}.stage{min-height:430px}#graph{height:430px}.trace{padding:11px 13px}}
</style>
</head>
<body>
<main>
<header><div class="brand">文法？知るか！</div><span class="version">GRAPH EXPERIMENT · 005</span></header>
<section class="intro">
<div><div class="eyebrow">GRAMMAR GRAPH</div><h1>点开一条关系，继续探索。</h1><p>点击节点展开关系，拖动节点整理布局；「書く」在活用时才显示词干与词尾的分界。</p></div>
<nav class="switch" aria-label="起点"><button data-mode="kaku" aria-pressed="true">書く</button><button data-mode="mai" aria-pressed="false">まい</button></nav>
</section>
<section class="shell">
<div class="tools"><div class="surface"><small>当前构造</small><output id="surface">書く</output></div><div class="actions"><button id="back" type="button">← 返回</button><button id="reset" type="button">重置</button></div></div>
<div class="stage" id="stage">
<svg id="graph" role="img" aria-label="逐级展开的日语语法关系图"></svg>
<aside class="popover" id="popover" hidden><button id="close" type="button" aria-label="关闭说明">✕</button><h2 id="info-title"></h2><p id="info-text"></p></aside>
</div>
<div class="trace" id="trace"></div>
</section>
<p class="foot">初始「書く」是一个完整节点，进入活用时才在节点内部显示「書｜く」。拖动节点时连线会跟随移动，重置可恢复默认布局。仍只使用少量语法样本。</p>
</main>
<script>
"use strict";
const graphs = {
 kaku: { direction:1, root:"kaku", nodes:{
  kaku:{label:"書く",sub:"五段动词 · 基本形",pieces:["書","く"],form:"書く",info:"「書」是词干，「く」是活用词尾。点击展开不同活用形。",children:["ka","ki","ke","ko"]},
  ka:{label:"か",sub:"未然形 · く → か",form:"書か",info:"「書く」的「く」变为「か」，可以接否定助动词「ない」等。",children:["nai","seru"]},
  ki:{label:"き",sub:"连用形 · く → き",form:"書き",info:"五段动词的连用形，可接「ます」等。",children:["masu"]},
  ke:{label:"け",sub:"假定形 · く → け",form:"書け",info:"假定形「書け」后接「ば」。",children:["ba"]},
  ko:{label:"こ",sub:"未然形 · く → こ",form:"書こ",info:"意向表达中的未然形；接「う」后组成「書こう」。",children:["u"]},
  nai:{label:"ない",sub:"否定助动词",pieces:["な","い"],form:"書かない",info:"「ない」是一个助动词，拆成「な｜い」展示活用。「い」可变为「かっ」「く」。",children:["katt","naku"]},
  seru:{label:"せる",sub:"使役助动词",pieces:["せ","る"],form:"書かせる",info:"五段动词未然形「書か」接使役助动词「せる」。本例暂不继续。",children:[]},
  katt:{label:"かっ",sub:"い → かっ · 连用形",form:"書かなかっ",info:"「な」保留，词尾「い」变化为「かっ」，为接过去助动词「た」做准备。",children:["ta"]},
  naku:{label:"く",sub:"い → く · 连用形",form:"書かなく",info:"「ない」的连用形「なく」可以接「て」。",children:["te"]},
  ta:{label:"た",sub:"过去助动词",form:"書かなかった",info:"拼接结果：書｜か｜な｜かっ｜た。",children:[]},
  te:{label:"て",sub:"接续助词",form:"書かなくて",info:"「なく」后接「て」，得到「書かなくて」。",children:[]},
  masu:{label:"ます",sub:"礼貌助动词",form:"書きます",info:"动词连用形后接「ます」。",children:[]},
  ba:{label:"ば",sub:"接续助词",form:"書けば",info:"假定形后接「ば」。",children:[]},
  u:{label:"う",sub:"意向助动词",form:"書こう",info:"意向表达「書こう」。",children:[]}
 }},
 mai: { direction:-1, root:"mai", nodes:{
  mai:{label:"まい",sub:"否定意志・否定推量",form:"まい",info:"向左逐级探索「まい」允许的前接条件。此处根据样本分别列出动词和助动词。",children:["verb","aux"]},
  verb:{label:"动词",sub:"先按活用类别分组",info:"五段动词、一段动词接「まい」时，样本中的要求不同。",children:["godan","ichidan"]},
  aux:{label:"助动词",sub:"按各自活用形式",info:"部分助动词也能接「まい」。本例只展示使役助动词。",children:["seru"]},
  godan:{label:"五段动词",sub:"活用类别",info:"本样本中，五段动词使用终止形接「まい」。",children:["terminal"]},
  ichidan:{label:"一段动词",sub:"活用类别",info:"本样本中，一段动词可用未然形接「まい」。",children:["irrealis"]},
  seru:{label:"使役「せる」",sub:"助动词类别",info:"使役助动词的未然形「せ」可接「まい」。",children:["seruIrrealis"]},
  terminal:{label:"终止形",sub:"所需活用形",info:"例如五段动词「書く」的终止形。",children:["kakumai"]},
  irrealis:{label:"未然形",sub:"所需活用形",info:"例如一段动词「食べる」的未然形「食べ」。",children:["tabemai"]},
  seruIrrealis:{label:"未然形",sub:"所需活用形",info:"使役「せる」的未然形「せ」。",children:["kakasemai"]},
  kakumai:{label:"書く",sub:"词例 · 终止形",form:"書くまい",info:"書く（五段动词终止形）＋まい。",children:[]},
  tabemai:{label:"食べ",sub:"词例 · 未然形",form:"食べまい",info:"食べ（一段动词未然形）＋まい。",children:[]},
  kakasemai:{label:"書かせ",sub:"词例 · 未然形",form:"書かせまい",info:"使役助动词「せる」的未然形接「まい」。",children:[]}
 }}
};
let mode="kaku";
let path=["kaku"];
let depthShown=0;
const positions={kaku:new Map(),mai:new Map()};
let visualNodes=new Map(),visualEdges=new Map();
let dragging=null;
let suppressClick=null;
const svg=document.getElementById("graph");
const stage=document.getElementById("stage");
const popover=document.getElementById("popover");
const S="http://www.w3.org/2000/svg", W=166, H=88, DX=217, DY=116;
function data(){return graphs[mode]}
function node(id){return data().nodes[id]}
function el(tag,attrs={},txt){
 const e=document.createElementNS(S,tag);
 for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));
 if(txt!==undefined)e.textContent=txt;
 return e;
}
function clickNode(id,depth){
 const item=node(id);
 if(path[depth]===id) depthShown=depthShown>depth?depth:(item.children.length?depth+1:depth);
 else {path=path.slice(0,depth).concat(id);depthShown=item.children.length?depth+1:depth}
 render();
}
function restart(next){
 mode=next;path=[data().root];depthShown=0;
 positions[mode].clear();suppressClick=null;render();
}
function showInfo(id){
 const item=node(id);
 document.getElementById("info-title").textContent=item.label;
 document.getElementById("info-text").textContent=item.info;
 popover.hidden=false;
}
function layout(){
 const offset=id=>positions[mode].get(id)||{x:0,y:0};
 const rootOffset=offset(data().root);
 const items=[{id:data().root,parent:null,depth:0,x:rootOffset.x,y:rootOffset.y,baseY:0,onPath:true}];
 for(let depth=1;depth<=depthShown;depth++){
  const parentId=path[depth-1];
  const parent=items.find(a=>a.id===parentId&&a.depth===depth-1);
  if(!parent)break;
  const children=node(parentId).children;
  children.forEach((id,index)=>{
   const baseY=parent.baseY+(index-(children.length-1)/2)*DY;
   const pos=offset(id);
   items.push({id,parent:parentId,depth,x:depth*DX*data().direction+pos.x,y:baseY+pos.y,baseY,onPath:path[depth]===id});
  });
 }
 return items;
}
function nodeGraphic(n){
 const item=node(n.id),kind=n.depth===0?"root":n.onPath?"active":"ghost";
 const g=el("g",{class:"node "+kind,transform:"translate("+n.x+","+n.y+")",role:"button",tabindex:"0","aria-label":item.label+" "+item.sub});
 g.appendChild(el("rect",{class:"shape",x:-W/2,y:-H/2,width:W,height:H}));
 // 初始整个动词是一块；进入活用后才在同一节点内部划分词干和词尾。
 const verbEnding=mode==="kaku"&&["ka","ki","ke","ko"].includes(n.id)&&n.onPath;
 const parts=n.id==="kaku"&&depthShown>0?["書","く"]:
   verbEnding?["書",item.label]:
   item.pieces&&n.onPath&&depthShown>n.depth?item.pieces:null;
 if(parts&&parts.length===2){
  g.appendChild(el("rect",{class:"segment-bg",x:-53,y:-25,width:106,height:36}));
  g.appendChild(el("line",{class:"segment-divider",x1:0,y1:-25,x2:0,y2:11}));
  parts.forEach((part,i)=>g.appendChild(el("text",{
   class:"mainlabel",x:i===0?-26:26,y:0,"text-anchor":"middle"
  },part)));
 } else g.appendChild(el("text",{class:"mainlabel",x:0,y:0,"text-anchor":"middle"},item.label));
 g.appendChild(el("text",{class:"sublabel",x:0,y:26,"text-anchor":"middle"},item.sub));
 const info=el("g",{class:"info-hit",role:"button",tabindex:"0","aria-label":"查看"+item.label+"说明"});
 info.appendChild(el("circle",{class:"information",cx:69,cy:-30,r:9}));
 info.appendChild(el("text",{class:"infoletter",x:69,y:-26,"text-anchor":"middle"},"i"));
 info.addEventListener("click",e=>{e.stopPropagation();showInfo(n.id)});
 info.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();e.stopPropagation();showInfo(n.id)}});
 g.appendChild(info);
 g.addEventListener("pointerdown",event=>{
  if(event.target.closest?.(".info-hit"))return;
  if(event.pointerType==="mouse"&&event.button!==0)return;
  const box=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;
  const scale=Math.min(box.width/vb.width,box.height/vb.height)||1;
  const start=positions[mode].get(n.id)||{x:0,y:0};
  dragging={id:n.id,pointerId:event.pointerId,x:event.clientX,y:event.clientY,
    initialX:start.x,initialY:start.y,scale,moved:false};
  suppressClick=null;
  g.setPointerCapture?.(event.pointerId);
 });
 g.addEventListener("pointermove",event=>{
  if(!dragging||dragging.id!==n.id||dragging.pointerId!==event.pointerId)return;
  const dx=(event.clientX-dragging.x)/dragging.scale;
  const dy=(event.clientY-dragging.y)/dragging.scale;
  if(!dragging.moved&&Math.hypot(event.clientX-dragging.x,event.clientY-dragging.y)<5)return;
  dragging.moved=true;
  positions[mode].set(n.id,{x:dragging.initialX+dx,y:dragging.initialY+dy});
  g.setAttribute("class","node "+kind+" dragging");
  updateGeometry();
 });
 function finishDrag(event){
  if(!dragging||dragging.id!==n.id||dragging.pointerId!==event.pointerId)return;
  suppressClick=dragging.moved?n.id:null;
  dragging=null;
  g.setAttribute("class","node "+kind);
 }
 g.addEventListener("pointerup",finishDrag);
 g.addEventListener("pointercancel",event=>{
  if(dragging&&dragging.pointerId===event.pointerId){
   suppressClick=null;dragging=null;g.setAttribute("class","node "+kind);
  }
 });
 g.addEventListener("click",()=>{
  if(suppressClick===n.id){suppressClick=null;return}
  clickNode(n.id,n.depth);
 });
 g.addEventListener("keydown",e=>{if(e.target===g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();clickNode(n.id,n.depth)}});
 return g;
}
function edgePath(parent,child){
 const forward=data().direction===1;
 const x1=forward?parent.x+W/2:child.x+W/2,x2=forward?child.x-W/2:parent.x-W/2;
 const y1=forward?parent.y:child.y,y2=forward?child.y:parent.y,mid=(x1+x2)/2;
 return "M "+x1+" "+y1+" C "+mid+" "+y1+", "+mid+" "+y2+", "+x2+" "+y2;
}
function edge(parent,child){
 return el("path",{class:"edge"+(child.onPath?" solid":""),d:edgePath(parent,child)});
}
function updateGeometry(){
 const items=layout(),lookup=new Map(items.map(item=>[item.id,item]));
 items.forEach(item=>{
  visualNodes.get(item.id)?.setAttribute("transform","translate("+item.x+","+item.y+")");
  if(item.parent)visualEdges.get(item.id)?.setAttribute("d",edgePath(lookup.get(item.parent),item));
 });
}
function render(){
 const items=layout(),lookup=new Map(items.map(a=>[a.id,a]));
 const minX=Math.min(...items.map(a=>a.x))-157,maxX=Math.max(...items.map(a=>a.x))+157;
 const minY=Math.min(...items.map(a=>a.y))-128,maxY=Math.max(...items.map(a=>a.y))+128;
 const width=Math.max(900,maxX-minX),height=Math.max(430,maxY-minY);
 const centerX=(minX+maxX)/2,centerY=(minY+maxY)/2;
 svg.setAttribute("viewBox",[centerX-width/2,centerY-height/2,width,height].join(" "));
 svg.style.width=Math.max(900,width)+"px";
 svg.replaceChildren();
 visualNodes=new Map();visualEdges=new Map();
 items.forEach(item=>{
  if(item.parent){
   const line=edge(lookup.get(item.parent),item);
   visualEdges.set(item.id,line);
   svg.appendChild(line);
  }
 });
 items.forEach(item=>{
  const graphics=nodeGraphic(item);
  visualNodes.set(item.id,graphics);
  svg.appendChild(graphics);
 });
 const id=path[Math.min(depthShown,path.length-1)];
 const current=node(id);
 document.getElementById("surface").textContent=current.form||(mode==="mai"?"まい · "+current.label:"書く");
 document.getElementById("back").disabled=depthShown===0;
 for(const button of document.querySelectorAll("[data-mode]"))button.setAttribute("aria-pressed",String(button.dataset.mode===mode));
 const bar=document.getElementById("trace");bar.replaceChildren();
 const hint=document.createElement("span");hint.className="hint";hint.textContent="探索路径";bar.appendChild(hint);
 const reached=path.slice(0,Math.min(depthShown+1,path.length));
 reached.forEach((id,i)=>{
  if(i){const arrow=document.createElement("span");arrow.className="arrow";arrow.textContent=mode==="mai"?"←":"→";bar.appendChild(arrow)}
  const button=document.createElement("button");button.type="button";button.textContent=node(id).label;
  button.addEventListener("click",()=>clickNode(id,i));bar.appendChild(button);
 });
 popover.hidden=true;
 // 小屏幕始终让当前实节点出现在可视区中央，而不把整张长图强行缩小。
 const active=items.find(a=>a.id===id&&a.onPath);
 const activeX=(active.x-(centerX-width/2))/width*svg.clientWidth;
 stage.scrollLeft=Math.max(0,Math.min(svg.clientWidth-stage.clientWidth,activeX-stage.clientWidth/2));
}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>restart(b.dataset.mode)));
document.getElementById("back").addEventListener("click",()=>{
 if(depthShown>=path.length){depthShown=path.length-1}
 else if(path.length>1){path.pop();depthShown=path.length}
 else depthShown=0;
 render();
});
document.getElementById("reset").addEventListener("click",()=>restart(mode));
document.getElementById("close").addEventListener("click",()=>{popover.hidden=true});
render();
</script>
</body>
</html>
